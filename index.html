<style>
/* Layout: one column "dashboard of a coastal city": living scene on top, gauges, then the decision desk. Single deliberate light look (limestone + Mediterranean). */
:root{
  --bg:#EEF1EC; --card:#FFFFFF; --ink:#13261F; --muted:#5B6B63; --line:#D3DBD3;
  --sea:#0F6E8C; --pine:#2F6B45; --sun:#B5820F; --ember:#C2412A; --gold:#E8A417;
  --water:#0F6E8C; --health:#C2412A; --economy:#B5820F; --nature:#2F6B45;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 span{color:var(--sea)}
.brand small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hdr-right{display:flex;gap:8px;align-items:center}
.timeline{display:flex;gap:6px}
.yr{font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.yr.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.yr.done{color:var(--pine);border-color:var(--pine)}
.lang{font:600 13px var(--body);border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.lang:focus-visible,button:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}

.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#DDEFF5;position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene .tag{position:absolute;left:12px;top:10px;font:700 12px var(--mono);background:rgba(19,38,31,.82);color:#fff;padding:4px 8px;border-radius:6px;letter-spacing:.04em}

.gauges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.g .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.g .val{font:700 20px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:#E5EAE4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.g.low{border-color:var(--ember)}
.g.budget{background:var(--ink);color:#fff;border-color:var(--ink)}
.g.budget .lbl{color:#B9C7BF}.g.budget .val{color:var(--gold)}
.g.budget .unit{font:500 12px var(--body);color:#B9C7BF}

.desk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.desk h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.ctx{margin:0;color:var(--muted);max-width:65ch}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s, transform .15s, background .15s}
.opt:hover:not([aria-disabled="true"]){border-color:var(--ink);transform:translateY(-2px);background:#fff}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.opt .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.opt b{font-weight:700;font-size:15px;line-height:1.3}
.cost{font:700 13px var(--mono);white-space:nowrap;background:var(--ink);color:var(--gold);border-radius:6px;padding:2px 7px}
.cost s{color:#9AA9A1;font-weight:500;margin-right:4px}
.opt p{margin:0;font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:600 11.5px var(--body);border-radius:99px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.w{color:var(--water)}.chip.h{color:var(--health)}.chip.e{color:var(--economy)}.chip.n{color:var(--nature)}
.chip.prot{color:#fff;background:var(--pine);border-color:var(--pine)}
.chip.disc{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.chip.risk{color:#fff;background:var(--ember);border-color:var(--ember)}
.note{font-size:12.5px;color:var(--muted)}

.fb{display:flex;flex-direction:column;gap:12px}
.fact{border-left:4px solid var(--gold);background:#FBF5E4;padding:12px 14px;border-radius:0 10px 10px 0;max-width:72ch}
.fact strong{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sun);margin-bottom:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 15px var(--body);background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.btn:hover{background:var(--sea)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.event{border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--ink);color:#fff}
.event .eyebrow{color:var(--gold)}
.event h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,32px);margin:0;line-height:1.1}
.event p{margin:0;color:#D6E0DA;max-width:65ch}
.verdict{font-weight:700;padding:8px 12px;border-radius:8px;align-self:flex-start}
.verdict.ok{background:var(--pine)}.verdict.bad{background:var(--ember)}
.event .chip{color:#fff;border-color:rgba(255,255,255,.5)}
.later{border-top:1px solid rgba(255,255,255,.2);padding-top:10px;display:flex;flex-direction:column;gap:6px}

.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.intro h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.5vw,44px);line-height:1.02;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.intro ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.intro .how{background:var(--bg);border-radius:12px;padding:16px}
.intro .how h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.end h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);margin:0;line-height:1}
.score{font:700 15px var(--mono);color:var(--muted)}
.log{width:100%;border-collapse:collapse;font-size:14px}
.log td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.log td:first-child{font-family:var(--mono);color:var(--muted);white-space:nowrap;width:1%}
.tablewrap{overflow-x:auto}
.votes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vote{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:14px;font-weight:600;background:var(--bg)}
.vote input{accent-color:var(--sea);width:18px;height:18px}
.vote.sel{border-color:var(--sea);background:#E3F0F3}
.tally{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:13.5px}
.trow .bar{height:10px}
.trow span:last-child{font-family:var(--mono);text-align:right}
footer{font-size:12px;color:var(--muted);max-width:80ch}
h3.sec{margin:6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

@media (max-width:760px){
  .opts{grid-template-columns:1fr}
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g.budget{grid-column:span 2}
  .intro{grid-template-columns:1fr}
  .votes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:110px minmax(0,1fr) 32px}
}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.flame{transform-box:fill-box;transform-origin:bottom;animation:flick .5s infinite}
@media (prefers-reduced-motion: reduce){.flame{animation:none}.bar i{transition:none}.opt{transition:none}}
</style>

  '<h3 class="sec">'+u("events")+'</h3><div class="tablewrap"><table class="log">'+evs+'</table></div></section>'+
  '<section class="desk"><div class="eyebrow">COP31</div><h2>'+u("voteH")+'</h2><p class="ctx">'+u("voteP")+'</p><div class="votes">'+votes+'</div>'+
  (S.saved?tally:'<div class="btnrow"><button class="btn" id="save"'+(S.votes.length===3?"":" disabled")+'>'+(S.votes.length===3?u("save"):u("pick")+" ("+S.votes.length+"/3)")+'</button></div>')+
  '<div class="btnrow"><button class="btn ghost" id="again">'+u("again")+'</button></div></section>'+foot();
}
function foot(){return '<footer>'+u("footer")+'</footer>';}

/* ---------- logic ---------- */
function choose(i){
  var dec=DEC[S.round*3+S.d], o=dec.opts[i], c=costOf(o);
  if(c>S.budget) return;
  S.budget-=c; S.paid=c; apply(o.eff);
  o.tags.forEach(function(t){if(!has(t))S.tags.push(t);});
  o.flags.forEach(function(f){if(S.flags.indexOf(f)<0)S.flags.push(f);});
  if(o.later) S.pending.push({due:S.round+o.later.due,eff:o.later.eff,msg:o.later.msg});
  S.log.push({round:S.round,di:S.round*3+S.d,oi:i});
  S.last=i; S.phase="feedback"; render(true);
}
function pickEvent(){
  var pool=POOLS[S.round], ws=pool.map(function(id){var E=EVENTS[id], prot=E.tags.some(has), w=1+(prot?0:3); if(id==="fire"&&S.flags.indexOf("fireRisk")>=0) w+=3; return w;});
  var tot=ws.reduce(function(a,b){return a+b;},0), r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){r-=ws[i]; if(r<=0) return pool[i];}
  return pool[pool.length-1];
}
function runEvent(){
  var id=pickEvent(), E=EVENTS[id], prepared=E.tags.some(has), base=prepared?E.prot:E.dmg, warn=has("warn"), dmg={};
  KEYS.forEach(function(k){if(base[k]) dmg[k]=warn?Math.round(base[k]/2):base[k];});
  apply(dmg);
  var later=S.pending.filter(function(p){return p.due===S.round;});
  S.pending=S.pending.filter(function(p){return p.due!==S.round;});
  later.forEach(function(p){apply(p.eff);});
  S.ev={id:id,prepared:prepared,warn:warn,dmg:dmg,later:later};
  S.evlog.push({round:S.round,id:id,prepared:prepared});
  S.phase="event";
}
function next(){
  if(S.phase==="feedback"){ if(S.d<2){S.d++;S.phase="decide";} else runEvent(); }
  else if(S.phase==="event"){ if(S.round<2){S.round++;S.d=0;S.budget+=10;S.phase="decide";} else S.phase="end"; }
  render(true);
}
function loadTally(){try{var t=JSON.parse(localStorage.getItem("antalya2050-votes")||"null");return Array.isArray(t)?t:[0,0,0,0,0,0,0,0,0];}catch(e){return [0,0,0,0,0,0,0,0,0];}}
function save(){
  var t=loadTally(); S.votes.forEach(function(i){t[i]=(t[i]||0)+1;});
  try{localStorage.setItem("antalya2050-votes",JSON.stringify(t));}catch(e){}
  S.tally=t; S.saved=true; render(false);
}

var app=document.getElementById("app");
function render(top){
  var v={intro:vIntro,decide:vDecide,feedback:vFeedback,event:vEvent,end:vEnd}[S.phase]();
  app.innerHTML=v;
  if(top){try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}}
  document.documentElement.lang=L;
}
app.addEventListener("click",function(e){
  var t=e.target.closest("button,.opt"); if(!t) return;
  if(t.id==="lang"){L=L==="tr"?"en":"tr";render(false);return;}
  if(t.id==="start"){S=fresh();S.phase="decide";render(true);return;}
  if(t.id==="next"){next();return;}
  if(t.id==="again"){var keep=L;S=fresh();L=keep;S.phase="decide";render(true);return;}
  if(t.id==="save"&&S.votes.length===3){save();return;}
  if(t.classList.contains("opt")&&t.getAttribute("aria-disabled")!=="true"){choose(+t.dataset.i);}
});
app.addEventListener("change",function(e){
  var t=e.target; if(!t.dataset||t.dataset.v===undefined) return;
  var i=+t.dataset.v, k=S.votes.indexOf(i);
  if(t.checked){ if(S.votes.length>=3){t.checked=false;return;} if(k<0)S.votes.push(i);} else if(k>=0) S.votes.splice(k,1);
  render(false);
});
render(false);
})();
</script>
